    name: "19 LCD escape to default page"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 19

  # 20 Backlight — QFLAG x
  backlight_control:
    name: "20 Backlight control"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 20

  # 22 Beeps when primary source interrupt — QFLAG y
  alarm_primary_source_interrupt:
    name: "22 Beeps on primary source interrupt"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 22

  # 23 Overload bypass — QFLAG b
