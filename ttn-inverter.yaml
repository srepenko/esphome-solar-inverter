    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 8

  # 09 Output frequency — F50/F60
  ac_output_rating_frequency:
    name: "09 AC output frequency"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 9

  # 11 Max AC charging current — MUCHGC, 10–100 A step 10 (2A на LCD — особое)
  max_ac_charging_current:
    name: "11 Max AC charging current"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 11

  # 12 Back to utility (SBU) — PBCV, 44–51 V step 1
  battery_recharge_voltage:
    name: "12 Back to utility source"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 12

  # 13 Back to battery — PBDV, 48–58 V step 1
  battery_redischarge_voltage:
    name: "13 Back to battery"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 13

  # 16 Charger source priority CSO/SNU/OSO — C++ pointer only, no PGR mapping here
  #  charger_source_priority:
  #    name: "16 Charger source priority"

