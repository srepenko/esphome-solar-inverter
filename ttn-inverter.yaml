substitutions:
  name: ttn-inverter
  inv_id: ttn-inverter
  device_description: "Hybrid inverter via MAX communication"
  # Use @work until schema API + program 01 land on main (PR #3). Switch to @main after that merge.
  external_components_source: github://srepenko/esphome-solar-inverter@work
  
esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2025.11.0
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  variant: ESP32C3
  board: seeed_xiao_esp32c3
  framework:
    type: arduino
#    type: esp-idf

#external_components:
#  - source:
#      type: local
#      path: /homeassistant/esphome/components

external_components:
  - source: ${external_components_source}
    refresh: 0s


# Enable logging
logger:
#  level: WARN
  level: DEBUG
#  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "hgwo/GG/lG7OZ+7E01mlPSLmnDF2h0Ir+DBdAWOFWp4="

ota:
  - platform: esphome
    password: "9666b3dc9f968de6cf6f0bf63e6df765"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ttn-Inverter Fallback Hotspot"
    password: "oowz1NK2QMBW"

captive_portal:
web_server:
  # HA device page has no real tabs. Groups below are for ESPHome web UI.
  # In HA: entity_category config = Configuration, diagnostic = Diagnostic.
  sorting_groups:
    - id: grp_status
      name: "Состояние"
      weight: 10
    - id: grp_settings
      name: "Настройки (как на LCD)"
      weight: 20
    - id: grp_debug
      name: "Отладка протокола"
      weight: 30

#uart:
#  id: uart_bus
#  tx_pin: GPIO21
#  rx_pin: GPIO20
#  baud_rate: 2400
#  stop_bits: 1
#  debug:
#    direction: BOTH
uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 2400
#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    sequence:
#      - lambda: UARTDebug::log_string(direction, bytes);

