    name: "23 Overload bypass"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 23

  # 25 Record fault code — QFLAG z
  fault_code_record:
    name: "25 Record fault code"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 25

  # 26/27/29 battery voltages — not in CONFIG_SCHEMA
  #  battery_bulk_voltage:
  #    name: "26 Battery bulk voltage"
