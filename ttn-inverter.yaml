  energy_inverter_total:
    name: "Inverter Energy This Total"

  # ── Настройки в порядке программ LCD / мануала (entity_category: config) ──
  # 01 Output source priority. HA: select.ttn_inverter_output_source_priority
  # SET: POP00 USB, POP01 SUB, POP02 SBU. QPIRI 3 = UtS на LCD; POP03 НЕ шлём (нет в MAX).
  output_source_priority:
    name: "01 Output source priority"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 1
  output_source_priority_text:
    name: "01 Output source priority description"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 2
  output_source_priority_code:
    name: "01 Output source priority QPIRI code"
    web_server:
      sorting_group_id: grp_debug
      sorting_weight: 1

  # 02 Max charging current — MNCHGC, 10–120 A step 10
  max_charging_current:
    name: "02 Max total charging current"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 2

  # 03 Input voltage range APL/UPS — not in CONFIG_SCHEMA
  #  input_voltage_range:
  #    name: "03 Input voltage range"

  # 04 Power saving — QFLAG w
  power_saving:
    name: "04 Power saving mode"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 4

  # 05 Battery type AGM/Flooded/User — not in CONFIG_SCHEMA
